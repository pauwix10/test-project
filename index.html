<!DOCTYPE html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Tag Manager: NOT INSTALLED YET. Paste the client's container
         snippet here and the noscript iframe at the top of <body>, in all four
         shells. GA4 belongs inside the container, not in this repo; each of
         the five custom events in src/lib/analytics.ts then needs a Custom
         Event trigger and a GA4 Event tag. If the client installs gtag.js
         directly instead, the events reach GA4 with no tags, because
         analytics.ts also calls gtag() when it exists. Never both: every event
         would count twice. If Google Ads call tracking is added, its
         phone_conversion_number must be "1-866-509-5052" exactly as printed
         (SITE.phone in src/lib/site.ts). -->

    <!-- LCP hero preload, WRITTEN by `npm run images` from the same data as
         src/lib/pics.ts. It repeats the hero <img> in src/pages/MeetingRooms.tsx
         (pic(HERO), sizes="100vw") exactly; any mismatch downloads it twice. -->
    <link rel="preload" as="image" href="/images/group-1-1640.webp" imagesrcset="/images/group-1-400.webp 400w, /images/group-1-700.webp 700w, /images/group-1-1100.webp 1100w, /images/group-1-1600.webp 1600w, /images/group-1-1640.webp 1640w" imagesizes="100vw" fetchpriority="high" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet" />

    <!-- No rates in the meta: pricing is gated on every track by client
         instruction. Do not add a "from $X" figure here. -->
    <title>Meeting Rooms and Event Space in Ottawa | TCC Canada</title>
    <meta name="description" content="More than 20 meeting, training and event spaces across five TCC locations in Ottawa and Kanata, for 2 to 200 guests. Hybrid-ready, hosted, by the hour or day." />
    <!-- Domain is a placeholder until the client confirms the landing host. -->
    <link rel="canonical" href="https://tour.tcccanada.com/ottawa-meeting-rooms/" />
    <!-- Remove noindex when the page moves from ads-only to organic -->
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="Meeting Rooms and Event Space in Ottawa | TCC Canada" />
    <meta property="og:description" content="More than 20 meeting, training and event spaces across five TCC locations in Ottawa and Kanata, for 2 to 200 guests. Hybrid-ready, hosted, by the hour or day." />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tour.tcccanada.com/ottawa-meeting-rooms/" />
    <meta property="og:image" content="https://tour.tcccanada.com/og/ottawa-meeting-rooms.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Conference room at The Blair Centre, Ottawa" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Netlify Forms build-time stub. Netlify only accepts submissions for a
         form it finds in static HTML, and it cannot see the React form. Every
         field the page's LeadForm posts must be listed here, or Netlify drops
         its value silently. See src/lib/lead-form.tsx. -->
    <form name="meeting-rooms-quote" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="space" />
      <input name="location" />
      <input name="date" />
      <input name="name" />
      <input name="email" />
      <input name="gclid" />
      <input name="campaignid" />
      <input name="referrer" />
      <input name="bot-field" />
    </form>

    <script type="module" src="/src/entries/ottawa-meeting-rooms.tsx"></script>
  </body>
</html>
